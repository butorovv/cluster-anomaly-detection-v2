# Used WITH deploy/compose.yaml. Only PostgreSQL/Kafka and the existing bootstrap
# service (as a bounded benchmark harness) run. Runtime children share one quota.
services:
  postgres:
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    command: [postgres, -c, max_connections=160, -c, shared_buffers=256MB,
      -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all,
      -c, fsync=on, -c, synchronous_commit=on]
  kafka:
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
  bootstrap:
    image: ${CAD_IMAGE}
    working_dir: /src
    entrypoint: []
    cpus: 6
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      disable: true
    environment:
      SYSTEM_TEST_DATABASE_URL: postgres://cad_admin:${POSTGRES_PASSWORD}@postgres:5432/cad?sslmode=disable
      TEST_DATABASE_URL: postgres://cad_admin:${POSTGRES_PASSWORD}@postgres:5432/cad?sslmode=disable
      P07_TEST_DATABASE_URL: postgres://cad_admin:${POSTGRES_PASSWORD}@postgres:5432/cad?sslmode=disable
      SYSTEM_KAFKA_ISOLATED: '1'
      P07_TEST_KAFKA_ISOLATED: '1'
      P07_TEST_KAFKA_BROKERS: kafka:9092
      P07_WORKER_INTEGRATION: '1'
      SQLBENCH_SOURCE_COMMIT: ${SQLBENCH_SOURCE_COMMIT}
      CAD_SQL_TIMINGS: ${CAD_SQL_TIMINGS:-0}
      CAD_PPROF: '0'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    volumes:
      - type: bind
        source: ${SQLBENCH_RESULTS}
        target: /bench
      - type: bind
        source: ${SQLBENCH_GOLDEN}
        target: /golden
        read_only: true
